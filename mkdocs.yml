site_name: JoinMarket NG
site_url: https://joinmarket-ng.github.io/joinmarket-ng/
repo_url: https://github.com/joinmarket-ng/joinmarket-ng
repo_name: GitHub
copyright: <a href="https://github.com/joinmarket-ng/joinmarket-ng/blob/main/LICENSE">MIT License</a>

not_in_nav: |
  separator.md
  extension-documentation.md
  technical/tumbler-redesign.md

validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  logo: media/logo_title_v4.png
  features:
    - content.code.copy
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    primary: custom
    accent: custom

plugins:
  - search
  # Keep generated internals out of user search; they remain browsable in Reference.
  - exclude-search:
      exclude:
        - api/*
        - extension-documentation.md
        - technical/tumbler-redesign.md
        - separator.md
  - gen-files:
      scripts:
        - docs/_scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - jmcore/src
            - jmwallet/src
            - taker/src
            - maker/src
            - directory_server/src
            - orderbook_watcher/src
            - tumbler/src
            - jmwalletd/src
          options:
            docstring_style: numpy
            extensions:
              - docs/_extensions/hide_dataclass_init.py:HideDataclassInit
            show_source: true
            show_root_heading: true
            group_by_category: true
            show_category_heading: true
            members_order: alphabetical
            show_bases: true
            show_signature: true
            show_signature_annotations: true
            show_if_no_docstring: true

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start Here:
      - Get started: getting-started.md
      - Install: install.md
      - Set up Bitcoin and Tor: setup.md
      - Terminal menu: README-tui.md
  - Use Your Wallet:
      - Receive and send: README-jmwallet.md
      - Run a CoinJoin: README-taker.md
      - Run the tumbler: README-tumbler.md
      - Run a maker: README-maker.md
      - Back up and recover: recover-wallet.md
      - Update: update.md
  - Understand Privacy:
      - CoinJoin and wallet concepts: technical/concepts.md
      - Protect your funds and privacy: technical/best-practices.md
      - Common questions: faq.md
  - Troubleshoot: troubleshooting.md
  - Reference:
      - reference.md
      - Configuration: technical/configuration.md
      - Fidelity bonds: fidelity-bond-operations.md
      - Unattended makers: maker-service.md
      - Advanced installation: install-advanced.md
      - Experimental JAM NG Flatpak: flatpak.md
      - Wallet daemon (JAM API): README-jmwalletd.md
      - Orderbook watcher: README-orderbook-watcher.md
      - Directory server: README-directory-server.md
      - Release signatures: README-signatures.md
      - Technical reference:
          - technical/index.md
          - Compatibility: technical/overview.md
          - Architecture: technical/architecture.md
          - Protocol: technical/protocol.md
          - Privacy analysis: technical/privacy.md
          - Wallet internals: technical/wallet.md
          - Wallet scanning: technical/wallet-scanning.md
          - Security: technical/security.md
          - Maker verification: technical/maker-verification-checklist.md
          - Threat model: technical/threat-model.md
          - Neutrino TLS: technical/neutrino-tls.md
          - Sources: technical/references.md
      - Python API: api/
  - Contribute:
      - Development and documentation: technical/development.md
      - Core library: README-jmcore.md
      - Scripts: README-scripts.md
  - JoinMarket NG Orderbook: https://joinmarket-ng.sgn.space/

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmcore"
version = "0.39.2"
description = "Core library for JoinMarket components"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "JoinMarket Contributors"}
]
license = {text = "GPL-3.0"}
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "loguru>=0.7.2",
    # Maintained fork with Python 3.14 and modern libsecp256k1 compatibility.
    "python-bitcointx @ https://github.com/m0wer/python-bitcointx/releases/download/python-bitcointx-v2.1.1/python_bitcointx-2.1.1-py3-none-any.whl#sha256=2f82999aa557da5f501bf10ca51dd830bcf16aba27ed8d976065c798454c11c6",
    "httpx[socks]>=0.27.0",
    "httpx-socks>=0.9.0",
    # Async SOCKS5 client used by jmcore.network.connect_via_tor
    "python-socks>=2.0.0",
    # requests[socks] backend so Apprise notifications can use socks5h:// proxies
    "PySocks>=1.7.1",
    "sniffio>=1.3.0",
    "pynacl>=1.5.0",
    "cryptography>=46.0.0",
    # Bitcoin utilities (consolidated from multiple modules)
    "bech32>=1.2.0",
    "base58>=2.1.0",
    "mnemonic>=0.21",
    "apprise>=1.8.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    # Client used by tests/e2e/test_tx_monitor_e2e.py. jmcore is installed in
    # every CI job's dev extras, so this guarantees the dependency is present
    # regardless of which other components a job scopes itself to; the test
    # file is always collected via the shared root tests/ testpath.
    "websockets>=14.0",
]

[project.scripts]
jm-ng = "jmcore.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmcore = ["data/*.sh", "data/*.toml.template"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=jmcore --cov-report=html --cov-report=term --timeout=60"

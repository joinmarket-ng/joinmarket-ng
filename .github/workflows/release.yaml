name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  # Run required checks before creating release
  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/pre-commit.yaml

  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write

  prepare:
    needs: [pre-commit, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      notes: ${{ steps.extract_notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Extract notes for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Get content between version header and next version or end
            NOTES=$(awk "/## \[${VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"$'\n\n'"See [CHANGELOG.md](CHANGELOG.md) for details."
            fi
          else
            NOTES="Release ${VERSION}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-candidate-images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: directory-server
            dockerfile: ./directory_server/Dockerfile
            image: directory-server
            target: production
          - name: directory-server-debug
            dockerfile: ./directory_server/Dockerfile
            image: directory-server-debug
            target: debug
          - name: orderbook-watcher
            dockerfile: ./orderbook_watcher/Dockerfile
            image: orderbook-watcher
          - name: maker
            dockerfile: ./maker/Dockerfile
            image: maker
          - name: taker
            dockerfile: ./taker/Dockerfile
            image: taker
          - name: jmwalletd
            dockerfile: ./jmwalletd/Dockerfile
            image: jmwalletd
            target: "jmwalletd"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Git commit timestamp for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          flavor: |
            suffix=${{ matrix.tag_suffix || '' }}
          tags: |
            type=raw,value=release-candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use outputs with rewrite-timestamp for reproducible builds
          # rewrite-timestamp clamps all file timestamps inside the image to SOURCE_DATE_EPOCH
          # This ensures files created by apt-get, pip, etc. have consistent timestamps
          outputs: type=registry,rewrite-timestamp=true
          # Disable attestations for reproducible builds
          # Provenance and SBOM attestations include timestamps and environment data
          # that make builds non-reproducible across different build environments
          provenance: false
          sbom: false
          # Disable cache for reproducible builds
          # Cached layers from previous builds may have different package versions,
          # making local reproduction impossible. Fresh builds ensure consistency.
          no-cache: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            JOINMARKET_BUILD_COMMIT=${{ github.sha }}
            JOINMARKET_BUILD_REF=${{ github.ref_name }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

  scan-candidate-images:
    needs: build-candidate-images
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-security.yaml
    with:
      image-tags: '["release-candidate-${{ github.sha }}"]'
      platforms: >-
        [{"name":"linux/amd64","slug":"linux-amd64"},{"name":"linux/arm64","slug":"linux-arm64"},{"name":"linux/arm/v7","slug":"linux-arm-v7"}]

  promote-docker-images:
    needs: [prepare, scan-candidate-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: directory-server
            image: directory-server
          - name: directory-server-debug
            image: directory-server-debug
          - name: orderbook-watcher
            image: orderbook-watcher
          - name: maker
            image: maker
          - name: taker
            image: taker
          - name: jmwalletd
            image: jmwalletd

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote scanned candidate and export reproducibility digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          CANDIDATE_TAG: release-candidate-${{ github.sha }}
        run: |
          set -euo pipefail
          MAJOR_MINOR_VERSION=${VERSION%.*}
          CANDIDATE_IMAGE=${IMAGE}:${CANDIDATE_TAG}
          VERSION_IMAGE=${IMAGE}:${VERSION}

          # Retag the already-scanned multi-platform candidate without rebuilding it.
          docker buildx imagetools create \
            --tag "${VERSION_IMAGE}" \
            --tag "${IMAGE}:${MAJOR_MINOR_VERSION}" \
            --tag "${IMAGE}:latest" \
            "${CANDIDATE_IMAGE}"

          mkdir -p /tmp/digests
          manifest_digest=$(docker buildx imagetools inspect "${VERSION_IMAGE}" --format '{{.Manifest.Digest}}')
          if [[ ! ${manifest_digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine promoted manifest digest for ${VERSION_IMAGE}"
            exit 1
          fi
          echo "${manifest_digest}" > /tmp/digests/${{ matrix.image }}-manifest.txt

          # Layer digests are content-addressable and enable local reproducibility checks.
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            arch=$(echo "$platform" | sed 's|linux/||; s|/|-|')

            echo "Extracting layer digests for $platform..."
            layers=$(docker buildx imagetools inspect "${VERSION_IMAGE}" --raw | \
              jq -r --arg os "linux" --arg arch "${arch%-*}" --arg variant "${arch#*-}" \
                '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch and (.platform.variant // "") == (if $variant == $arch then "" else $variant end)) | .digest' | \
              head -1 | \
              xargs -I{} docker buildx imagetools inspect "${VERSION_IMAGE}@{}" --raw | \
              jq -r '.layers[].digest' | sort)

            echo "${layers}" > /tmp/digests/${{ matrix.image }}-${arch}-layers.txt
          done

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digests/
          retention-days: 1

  create-release:
    needs: [prepare, promote-docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      # Releases are born as pre-releases so releases/latest (used by the
      # installer, the TUI, and the update check) keeps pointing at the last
      # fully signed release. promote-release.yaml flips the flag once the
      # signature quorum lands on main.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ needs.prepare.outputs.version }}" \
            --verify-tag \
            --prerelease \
            --title "${{ needs.prepare.outputs.version }}" \
            --notes-file - <<'EOF'
          > Awaiting signature quorum: this pre-release is promoted automatically once the required trusted signatures land on `main`.

          ${{ needs.prepare.outputs.notes }}
          EOF

  publish-flatpak:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/flatpak.yaml
    with:
      version: ${{ needs.create-release.outputs.version }}
      upload_to_release: true

  # ==========================================================================
  # Generate release manifest with image digests for reproducible verification
  # ==========================================================================
  generate-manifest:
    needs: [create-release, promote-docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all digest artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Generate release manifest
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          COMMIT_SHA=${{ github.sha }}
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          BUILD_DATE=$(date -u -d @$SOURCE_DATE_EPOCH +"%Y-%m-%dT%H:%M:%SZ")

          # Create manifest file
          cat > release-manifest-${VERSION}.txt << EOF
          # JoinMarket NG Release Manifest
          # Version: ${VERSION}
          # Commit: ${COMMIT_SHA}
          # Build Date: ${BUILD_DATE}
          # SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}
          #
          # This manifest contains layer digests for reproducible build verification.
          # Layer digests are content-addressable hashes of the actual image layers,
          # which are identical regardless of manifest format (Docker vs OCI).
          #
          # Verification instructions: see technical/development docs

          ## Git Commit
          commit: ${COMMIT_SHA}
          source_date_epoch: ${SOURCE_DATE_EPOCH}

          ## Docker Images
          EOF

          # Add manifest digests first
          for digest_file in /tmp/digests/*-manifest.txt; do
            if [ -f "$digest_file" ]; then
              image_name=$(basename "$digest_file" .txt)
              digest=$(cat "$digest_file")
              echo "${image_name}: ${digest}" >> release-manifest-${VERSION}.txt
            fi
          done

          echo "" >> release-manifest-${VERSION}.txt
          echo "## Per-Platform Layer Digests (for reproducibility verification)" >> release-manifest-${VERSION}.txt

          # Add layer digests per platform
          for digest_file in /tmp/digests/*-layers.txt; do
            if [ -f "$digest_file" ]; then
              image_name=$(basename "$digest_file" .txt)
              echo "" >> release-manifest-${VERSION}.txt
              echo "### ${image_name}" >> release-manifest-${VERSION}.txt
              cat "$digest_file" >> release-manifest-${VERSION}.txt
            fi
          done

          cat release-manifest-${VERSION}.txt

      - name: Upload manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          COMMIT_SHA=${{ github.sha }}
          git show "${COMMIT_SHA}:install.sh" > install.sh
          gh release upload ${VERSION} release-manifest-${VERSION}.txt install.sh --clobber

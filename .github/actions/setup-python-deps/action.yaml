name: Setup Python Dependencies
description: Install JoinMarket NG Python dependencies with caching

inputs:
  python-version:
    description: Python version to use
    required: false
    default: '3.14'
  components:
    description: Comma-separated list of components to install (e.g., jmcore,jmwallet,maker)
    required: true
  install-dev:
    description: Install dev dependencies
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install native secp256k1 library
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev cmake build-essential
          python3 scripts/build_secp256k1.py \
            --prefix "$RUNNER_TEMP/secp256k1-native" \
            --build-dir "$RUNNER_TEMP/secp256k1-build"
          printf '%s\n' "$RUNNER_TEMP/secp256k1-native/lib" | sudo tee /etc/ld.so.conf.d/jmng-secp256k1.conf > /dev/null
          sudo ldconfig
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install secp256k1
        fi

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          **/requirements*.txt
          **/pyproject.toml

    - name: Install dependencies
      shell: bash
      run: |
        IFS=',' read -ra COMPONENTS <<< "${{ inputs.components }}"
        DEV_FLAG=""
        if [ "${{ inputs.install-dev }}" = "true" ]; then
          DEV_FLAG="[dev]"
        fi

        for component in "${COMPONENTS[@]}"; do
          component=$(echo "$component" | xargs)  # trim whitespace
          echo "Installing $component..."
          pip install -e "${component}${DEV_FLAG}"
        done

    - name: Verify loaded native MuSig support
      shell: bash
      run: |
        python -c 'from bitcointx.core.secp256k1 import get_secp256k1; assert get_secp256k1().cap.has_musig, "Loaded libsecp256k1 lacks MuSig support"'

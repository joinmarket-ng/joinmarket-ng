[info]
relay_url = "ws://swap-provider-e2e.onion/"
name = "JoinMarket swap provider E2E relay"
description = "Test-only Electrum swap relay"

[database]
data_directory = "/usr/src/app/db"

[network]
port = 7000
address = "0.0.0.0"

[limits]
messages_per_sec = 100
max_event_bytes = 65536
max_ws_message_bytes = 65536
max_ws_frame_bytes = 65536

[verified_users]
mode = "disabled"

[pay_to_relay]
enabled = false

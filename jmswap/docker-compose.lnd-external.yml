# Isolated two-node LND regtest stack for the external channel funding suite.
#
# Uses the same patched LND image as the channel-buyout regtest stack so the
# external funding flow and the buyout flow exercise one backend build.
services:
  lnd-bitcoin:
    image: lncm/bitcoind:v28.0
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=test
      - -rpcpassword=test
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "${LND_EXTERNAL_BITCOIN_PORT:-19443}:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=test -rpcpassword=test getblockchaininfo"]
      interval: 2s
      timeout: 2s
      retries: 30
    profiles: [lnd_external]

  lnd-opener:
    image: ${JM_BUYOUT_LND_IMAGE:-jm-buyout-lnd:v0.21.3-beta}
    entrypoint: [lnd]
    command: &lnd-command
      - --noseedbackup
      - --bitcoin.active
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=lnd-bitcoin:18443
      - --bitcoind.rpcuser=test
      - --bitcoind.rpcpass=test
      - --bitcoind.zmqpubrawblock=tcp://lnd-bitcoin:28332
      - --bitcoind.zmqpubrawtx=tcp://lnd-bitcoin:28333
      - --listen=0.0.0.0:9735
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --tlsextraip=127.0.0.1
      - --tlsextradomain=localhost
      - --protocol.simple-taproot-chans
      - --acceptortimeout=60s
      - --nobootstrap
    ports:
      - "${LND_EXTERNAL_OPENER_GRPC_PORT:-11009}:10009"
    volumes:
      - ${LND_EXTERNAL_DATA_DIR:-../tmp/lnd-external}/opener:/root/.lnd
    depends_on:
      lnd-bitcoin:
        condition: service_healthy
    profiles: [lnd_external]

  lnd-fundee:
    image: ${JM_BUYOUT_LND_IMAGE:-jm-buyout-lnd:v0.21.3-beta}
    entrypoint: [lnd]
    command: *lnd-command
    ports:
      - "${LND_EXTERNAL_FUNDEE_GRPC_PORT:-12009}:10009"
    volumes:
      - ${LND_EXTERNAL_DATA_DIR:-../tmp/lnd-external}/fundee:/root/.lnd
    depends_on:
      lnd-bitcoin:
        condition: service_healthy
    profiles: [lnd_external]

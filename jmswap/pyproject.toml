[project]
name = "jmswap"
version = "0.1.0"
description = "LND backend for co-funded channel rings"
requires-python = ">=3.11"
dependencies = [
    "jmcore",
    "pydantic>=2.5.0",
    "grpcio==1.81.1",
    "protobuf==6.33.6",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "grpcio-tools==1.81.1",
    "mypy>=1.7.0",
    "mypy-protobuf==5.1.0",
    "pip-tools==7.5.3",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.1.0",
    "types-grpcio==1.83.0.20260730",
]

[project.scripts]
jm-channel-maintenance = "jmswap.maintenance_cli:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmswap = ["py.typed", "lndrpc/*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../jmcore/src"]
addopts = "-v --cov=jmswap --cov-report=term --timeout=60"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jmswap.lndrpc.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/jmswap/lndrpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "jmswap"
version = "0.1.0"
description = "Standalone bidirectional Taproot Lightning swap provider/client library"
requires-python = ">=3.11"
dependencies = [
    "jmcore",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "coincurve>=21.0.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "grpcio-tools>=1.60.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmswap = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=jmswap --cov-report=html --cov-report=term --timeout=60"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ['src/jmswap/lndrpc/']

[[tool.mypy.overrides]]
module = "jmswap.lndrpc.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/jmswap/lndrpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

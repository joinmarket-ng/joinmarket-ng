[project]
name = "jmwallet"
version = "0.39.2"
description = "JoinMarket wallet library with pluggable blockchain backends"
requires-python = ">=3.11"
dependencies = [
    # Maintained fork with Python 3.14 and modern libsecp256k1 compatibility.
    "python-bitcointx @ https://github.com/m0wer/python-bitcointx/releases/download/python-bitcointx-v2.1.1/python_bitcointx-2.1.1-py3-none-any.whl#sha256=2f82999aa557da5f501bf10ca51dd830bcf16aba27ed8d976065c798454c11c6",
    "cryptography>=46.0.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "mnemonic>=0.21",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.scripts]
jm-wallet = "jmwallet.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.0.0",
    "pytest-rerunfailures>=14.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pdbpp",
    "memray",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=jmwallet --cov-report=html --cov-report=term --timeout=60"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests requiring any Docker services",
    "e2e: marks tests requiring Docker e2e profile",
    "reference: marks tests requiring Docker reference profile",
    "reference_migration: marks the mnemonic-only JAM maker migration suite",
    "neutrino: marks tests requiring Docker neutrino profile",
    "reference_maker: marks tests requiring Docker reference-maker profile",
    "flaky: marks tests that may fail due to external dependencies",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
